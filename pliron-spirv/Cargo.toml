[package]
edition = "2024"
name = "pliron-spirv"
rust-version.workspace = true
version.workspace = true

description = "Pliron dialect for SPIR-V"
documentation = "https://docs.rs/pliron-spirv"
keywords = ["spirv", "vulkan", "opengl", "opencl", "pliron"]
license = "Apache-2.0"
repository = "https://github.com/tracel-ai/tracel-rspirv"

[features]
# Convert op locations to SPIR-V debug data (`PlironBuilder::with_debug_info`).
# The cost is too small to measure. A clean dev build of this crate takes
# 30.4 s without the feature and 30.5 s with it (median of 3, rustc 1.98.1,
# x86_64 Linux). The rlib grows from 111.8 MB to 112.4 MB (+0.6%), and the
# unit test binary from 42.06 MB to 42.24 MB (+0.4%). The gate stays for
# consistency with the `debug-info` feature of `pliron-llvm`.
debug-info = []

[package.metadata.docs.rs]
features = ["debug-info"]

[dependencies]
derive-new = "0.7"
derive_more = { version = "2", features = ["from", "into"] }
itertools = "0.15"
pliron = { workspace = true }
thiserror = "2"

[dependencies.tracel-rspirv]
default-features = false
features = ["pliron"]
path = "../rspirv"
version = "=0.15.0"
